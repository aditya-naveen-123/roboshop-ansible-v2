- name: App setup
  import_role:
    name: common
    tasks_from: app-setup

- name: Node js installation
  import_role:
    name: common
    tasks_from: nodejs

- name: Systemd setup
  import_role:
    name: common
    tasks_from: systemd-setup

- name: copying mongo repo to the destination
  copy: 
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client
  package:
    name: mongodb-mongosh
    state: present

- name: catalogue schema exists or not
  shell: mongosh --host "{{MONGODB_SERVER_IP}}" --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_output

- name: load products into db
  shell: mongosh --host "{{MONGODB_SERVER_IP}}" </app/db/master-data.js
  when: catalogue_output.stdout | int < 0
  
- name: start and enable catalogue service
  service:
    name: catalogue
    state: restarted
    enabled: yes