- name: App setup
  import_role:
    name: common
    tasks_from: app-setup

- name: Node js installation
  import_role:
    name: common
    tasks_from: nodejs
    
- name: Systemd setup
  import_role:
    name: common
    tasks_from: systemd-setup

- name: start and enable user service
  service:
    name: user
    state: restarted
    enabled: yes
